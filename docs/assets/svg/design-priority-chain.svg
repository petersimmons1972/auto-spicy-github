<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" width="100%">
  <defs>
    <marker id="arrow-muted" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto">
      <path d="M1,1 L5,8 L9,1" fill="none" stroke="#3d5068" stroke-width="1.5"/>
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto">
      <path d="M1,1 L8,4 L1,7 Z" fill="#0af0c8"/>
    </marker>
  </defs>

  <!--
    PAINT ORDER:
    [A] Backgrounds
    [B] Geometry (shapes, diamonds)
    [C] Strokes + connector lines
    [D] Text
  -->

  <!-- ════════════════════════════════════════════ -->
  <!-- [A] BACKGROUNDS                              -->
  <!-- ════════════════════════════════════════════ -->

  <rect x="0" y="0" width="750" height="420" fill="#080c14"/>

  <!-- Subtle gutter separator line -->
  <rect x="108" y="0" width="1" height="420" fill="#1a2535"/>

  <!-- Tier 1 main box fill -->
  <rect x="122" y="20" width="268" height="58" fill="#0e1520"/>

  <!-- Tier 1 terminal fill -->
  <rect x="480" y="79" width="206" height="43" fill="#071811"/>

  <!-- Tier 2 main box fill -->
  <rect x="122" y="160" width="268" height="58" fill="#0e1520"/>

  <!-- Tier 2 terminal fill -->
  <rect x="480" y="221" width="174" height="43" fill="#071811"/>

  <!-- Tier 3 main box fill -->
  <rect x="122" y="300" width="268" height="58" fill="#0e1520"/>

  <!-- Tier 3 terminal fill (bottom, full width of main column) -->
  <rect x="122" y="374" width="330" height="36" fill="#071811"/>

  <!-- Diamond 1 fill: center (256,133) half-w=48 half-h=20 -->
  <polygon points="256,113 304,133 256,153 208,133" fill="#0b1624"/>

  <!-- Diamond 2 fill: center (256,274) half-w=48 half-h=20 -->
  <polygon points="256,254 304,274 256,294 208,274" fill="#0b1624"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- [B] GEOMETRY — structural lines             -->
  <!-- ════════════════════════════════════════════ -->

  <!-- Spine: Tier1 bottom → Diamond1 top -->
  <line x1="256" y1="78" x2="256" y2="111" stroke="#3d5068" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- Spine: Diamond1 bottom → Tier2 top -->
  <line x1="256" y1="153" x2="256" y2="158" stroke="#3d5068" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- Spine: Tier2 bottom → Diamond2 top -->
  <line x1="256" y1="218" x2="256" y2="252" stroke="#3d5068" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- Spine: Diamond2 bottom → Tier3 top -->
  <line x1="256" y1="294" x2="256" y2="298" stroke="#3d5068" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- Spine: Tier3 bottom → Terminal3 top -->
  <line x1="256" y1="358" x2="256" y2="372" stroke="#0af0c8" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- YES branch: Diamond1 right corner → Terminal1 left edge -->
  <polyline points="304,133 430,133 430,100 478,100" fill="none" stroke="#0af0c8" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- YES branch: Diamond2 right corner → Terminal2 left edge -->
  <polyline points="304,274 430,274 430,242 478,242" fill="none" stroke="#0af0c8" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- [C] STROKES — box borders                   -->
  <!-- ════════════════════════════════════════════ -->

  <!-- Tier 1 box border + left accent -->
  <rect x="122" y="20" width="268" height="58" fill="none" stroke="#3d5068" stroke-width="1"/>
  <rect x="122" y="20" width="3" height="58" fill="#0af0c8"/>

  <!-- Tier 1 terminal border -->
  <rect x="480" y="79" width="206" height="43" fill="none" stroke="#0af0c8" stroke-width="1.5"/>

  <!-- ALWAYS WINS badge inside terminal 1 -->
  <rect x="484" y="81" width="102" height="17" fill="#0af0c8"/>

  <!-- Tier 2 box border + left accent -->
  <rect x="122" y="160" width="268" height="58" fill="none" stroke="#3d5068" stroke-width="1"/>
  <rect x="122" y="160" width="3" height="58" fill="#a8bcd0" opacity="0.55"/>

  <!-- Tier 2 terminal border -->
  <rect x="480" y="221" width="174" height="43" fill="none" stroke="#0af0c8" stroke-width="1.5"/>

  <!-- offer to user badge -->
  <rect x="484" y="223" width="92" height="16" fill="#0af0c8"/>

  <!-- Tier 3 box border + left accent -->
  <rect x="122" y="300" width="268" height="58" fill="none" stroke="#3d5068" stroke-width="1"/>
  <rect x="122" y="300" width="3" height="58" fill="#a8bcd0" opacity="0.30"/>

  <!-- Terminal 3 border -->
  <rect x="122" y="374" width="330" height="36" fill="none" stroke="#0af0c8" stroke-width="1.5"/>
  <rect x="122" y="374" width="3" height="36" fill="#0af0c8"/>

  <!-- Diamond 1 border -->
  <polygon points="256,113 304,133 256,153 208,133" fill="none" stroke="#3d5068" stroke-width="1.2"/>

  <!-- Diamond 2 border -->
  <polygon points="256,254 304,274 256,294 208,274" fill="none" stroke="#3d5068" stroke-width="1.2"/>

  <!-- ════════════════════════════════════════════ -->
  <!-- [D] TEXT                                    -->
  <!-- ════════════════════════════════════════════ -->

  <!-- TIER INDEX LABELS -->
  <text x="72" y="55"
    font-family="'Share Tech Mono', monospace"
    font-size="20" fill="#a8bcd0"
    text-anchor="middle" font-weight="bold">01</text>

  <text x="72" y="195"
    font-family="'Share Tech Mono', monospace"
    font-size="20" fill="#a8bcd0"
    text-anchor="middle" font-weight="bold">02</text>

  <text x="72" y="335"
    font-family="'Share Tech Mono', monospace"
    font-size="20" fill="#a8bcd0"
    text-anchor="middle" font-weight="bold">03</text>

  <!-- Tier connector ticks -->
  <line x1="88" y1="49" x2="120" y2="49" stroke="#3d5068" stroke-width="1"/>
  <line x1="88" y1="189" x2="120" y2="189" stroke="#3d5068" stroke-width="1"/>
  <line x1="88" y1="329" x2="120" y2="329" stroke="#3d5068" stroke-width="1"/>

  <!-- TIER 1 MAIN BOX -->
  <text x="136" y="43"
    font-family="'Barlow Condensed', sans-serif"
    font-size="16" fill="#e2eaf6"
    font-weight="700" letter-spacing="0.5">VISUAL-IDENTITY.md</text>
  <text x="136" y="65"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#7a9ab8">docs/assets/ in target repo</text>

  <!-- TIER 1 TERMINAL -->
  <text x="535" y="93"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#071811"
    text-anchor="middle" font-weight="bold">ALWAYS WINS</text>
  <text x="583" y="112"
    font-family="'Share Tech Mono', monospace"
    font-size="13" fill="#0af0c8"
    text-anchor="middle">proceed to audit</text>

  <!-- DIAMOND 1 -->
  <text x="256" y="137"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#e2eaf6"
    text-anchor="middle">exists?</text>

  <!-- YES/NO branch labels -->
  <text x="338" y="124"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#0af0c8">YES</text>
  <text x="262" y="161"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#7a9ab8">NO</text>

  <!-- TIER 2 MAIN BOX -->
  <text x="136" y="183"
    font-family="'Barlow Condensed', sans-serif"
    font-size="16" fill="#e2eaf6"
    font-weight="700" letter-spacing="0.5">INSTALLED DESIGN SKILL</text>
  <text x="136" y="205"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#7a9ab8">~/.claude/skills/  ui-ux-pro-max or equiv.</text>

  <!-- TIER 2 TERMINAL -->
  <text x="530" y="234"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#071811"
    text-anchor="middle" font-weight="bold">offer to user</text>
  <text x="567" y="253"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#0af0c8"
    text-anchor="middle">skill loaded</text>

  <!-- DIAMOND 2 -->
  <text x="256" y="278"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#e2eaf6"
    text-anchor="middle">found?</text>

  <!-- YES/NO branch labels -->
  <text x="338" y="265"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#0af0c8">YES</text>
  <text x="262" y="302"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#7a9ab8">NO</text>

  <!-- TIER 3 MAIN BOX -->
  <text x="136" y="323"
    font-family="'Barlow Condensed', sans-serif"
    font-size="16" fill="#e2eaf6"
    font-weight="700" letter-spacing="0.5">DISCOVERY CONVERSATION</text>
  <text x="136" y="344"
    font-family="'Share Tech Mono', monospace"
    font-size="12" fill="#7a9ab8">art-direction skill  --  4 questions</text>

  <!-- TERMINAL 3 -->
  <text x="290" y="396"
    font-family="'Share Tech Mono', monospace"
    font-size="13" fill="#0af0c8"
    text-anchor="middle">VISUAL-IDENTITY.md authored + committed</text>

</svg>
